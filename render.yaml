services:
  - type: web
    name: personalized-entrance-exam-coach
    env: python
    plan: free
    buildCommand: bash render_build.sh
    startCommand: bash render_start.sh
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///learning.db
      - key: CORS_ORIGINS
        value: "https://personalized-entrance-exam-coach.onrender.com,http://localhost:3000"
      - key: NODE_VERSION
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11"
